name: Voice Pilot

on:
  workflow_dispatch:
  push:
    paths:
      - tools/voice_generation/voice_request.json

permissions:
  contents: read
  actions: write

jobs:
  voice-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 espeak-ng

      - name: Install open-source voice and QA tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2"
          python -m pip install "kokoro==0.9.4" soundfile faster-whisper jiwer

      - name: Validate pilot request
        run: |
          python tools/voice_generation/generate_voice_pilot.py \
            --request tools/voice_generation/voice_request.json \
            --output-dir voice-pilot-output \
            --validate-only

      - name: Generate native-pronunciation source and character conversion
        run: |
          python tools/voice_generation/generate_voice_pilot.py \
            --request tools/voice_generation/voice_request.json \
            --output-dir voice-pilot-output

      - name: Run strict linguistic QA
        run: |
          python tools/voice_generation/validate_voice_pilot.py \
            --request tools/voice_generation/voice_request.json \
            --output-dir voice-pilot-output \
            --model small \
            --max-word-error-rate 0.0 \
            --max-korean-character-error-rate 0.0

      - name: Remove previous temporary voice-pilot artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("voice-pilot-")) | .id')
          for id in $ids; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done
          exit 0

      - name: Upload one-day review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-pilot-${{ github.run_number }}
          path: voice-pilot-output/
          if-no-files-found: warn
          retention-days: 1
