name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: ${{ github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'docs:') || contains(github.event.head_commit.message, '[apk] docs:')) }}

      - name: Restore stable debug signing key
        id: debug-signing-cache
        uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: chiu-know-debug-keystore-v2

      - name: Create stable debug signing key if missing
        if: steps.debug-signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci-signing
          keytool -genkeypair \
            -keystore .ci-signing/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Chiu Know Debug,O=Chiu Know,C=BR" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK for deliberate runs only
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
        uses: actions/upload-artifact@v4
        with:
          name: chiu-know-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Keep only the 3 newest debug APK artifacts
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const artifactName = 'chiu-know-debug';
            const keep = 3;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            const matching = artifacts
              .filter(artifact => artifact.name === artifactName && !artifact.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            core.info(`Found ${matching.length} active ${artifactName} artifacts; keeping ${Math.min(keep, matching.length)}.`);

            for (const artifact of matching.slice(keep)) {
              core.info(`Deleting artifact ${artifact.id} created at ${artifact.created_at}.`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }
